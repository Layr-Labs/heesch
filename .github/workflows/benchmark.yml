name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # The record runner (docs/RUNNER.md): Blacksmith's 32-vCPU instance —
    # 128 GB RAM, 1.5 TB disk, GitHub-image-compatible Ubuntu 24.04, billed
    # only while a job runs. Prerequisite: the Blacksmith GitHub App is
    # installed for this repository (app.blacksmith.sh); until then this job
    # queues with "no runner matching". The harness derives its resource
    # profile from the machine (heesch_verify/profile.py: `record` iff
    # MemAvailable >= 24 GiB and scratch free >= 60 GiB) — the band that
    # admits every record certificate (F(S,7) to 20 cells, F(S,8) to 16).
    # The preflight below FAILS the job on a smaller machine rather than
    # letting it silently score under the narrow `standard` profile.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 240
    # Yukon reads the score both from the benchmark-score artifact and, like
    # the reference challenges (ecdsafail), from this job output.
    outputs:
      score: ${{ steps.score.outputs.value }}

    env:
      # Scratch for the sandboxed verify (DIMACS up to ~15 GB, payloads up to
      # 8 GiB): the runner's NVMe mount; benchmark.sh mktemp -d's under it.
      HEESCH_SCRATCH: ${{ vars.HEESCH_SCRATCH || '/tmp' }}

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 2
          persist-credentials: false

      # Yukon enforces editablePaths while constructing the commit. Keep this
      # independent check so a malformed submissions/* ref fails before setup.
      - name: Verify submission surface
        if: startsWith(github.ref, 'refs/heads/submissions/')
        shell: bash
        run: |
          set -euo pipefail

          read -r -a commit_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if (( ${#commit_line[@]} != 2 )); then
            echo "Submission must be a single-parent commit" >&2
            exit 1
          fi

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              submission|submission/*) ;;
              *)
                echo "Submission changed a non-editable path: $changed_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "$GITHUB_SHA^" "$GITHUB_SHA")

          # File-type surface (audit V12): the name-only check above is blind
          # to entry type, so a symlink (mode 120000) or gitlink (160000) at
          # submission/best.heesch passes it and would smuggle a host-file
          # read (V3) into the verifier. Require every entry under submission/
          # to be a regular blob (100644/100755).
          while IFS= read -r -d '' rec; do
            mode=${rec%% *}
            path=${rec#*$'\t'}
            case "$mode" in
              100644|100755) ;;
              *)
                echo "Submission entry has non-regular mode $mode: $path" >&2
                exit 1
                ;;
            esac
          done < <(git ls-tree -r -z "$GITHUB_SHA" -- submission)

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install sandbox dependency (bubblewrap)
        shell: bash
        run: |
          # Not preinstalled on GitHub-compatible images; the verify stage's
          # sandbox (benchmark.sh) and the preflight below require it.
          command -v bwrap >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          }
          bwrap --version

      - name: Runner preflight (fail loud below the record profile's minima)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          {
            uname -a
            python3 --version
            command -v bwrap && bwrap --version || echo "bubblewrap: absent"
            nproc; free -m | head -2; df -h "${HEESCH_SCRATCH}" | tail -1
            git rev-parse HEAD
          } | tee benchmark-results/runner.txt
          # Same thresholds as heesch_verify/profile.py RECORD (MemAvailable >= 24 GiB,
          # scratch free >= 60 GiB) plus the CPU/arch/sandbox the job needs.
          python3 tools/runner_preflight.py --scratch "${HEESCH_SCRATCH}" --require record \
            | tee -a benchmark-results/runner.txt

      - name: Setup
        run: |
          ./setup.sh
          # setup.sh builds the proof checkers; the record tier is unreachable
          # without the formally-verified one, so fail the job loudly here
          # rather than rejecting every proof-carrying submission as
          # CHECKER_UNAVAILABLE.
          test -x tools/bin/drat-trim && test -x tools/bin/lrat-check && test -x tools/bin/cake_lpr
          ls -la tools/bin | tee -a benchmark-results/runner.txt

      - name: Benchmark
        run: ./benchmark.sh

      - name: Report score
        id: score
        shell: bash
        run: |
          set -euo pipefail

          score=$(jq -er '.score | select(type == "number")' score.json)
          hc=$(jq -er '.metrics.hc_verified | select(type == "number")' score.json)
          evidence=$(jq -er '.metrics.non_tiler_evidence | select(. == "census" or . == "proof")' score.json)
          exact=$(jq -r '.metrics.exact' score.json)
          echo "score=$score (hc_verified=$hc, non_tiler_evidence=$evidence, exact=$exact)" | tee -a benchmark-results/runner.txt
          echo "value=$score" >> "$GITHUB_OUTPUT"

      - name: Upload score
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-score
          path: score.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-diagnostics-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
